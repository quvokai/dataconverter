name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        
        shell: bash

    env:
      
      FETCHCONTENT_BASE_DIR: ${{ github.workspace }}/.fc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: .fc
          key: fc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fc-${{ runner.os }}-

      - name: Show tool versions
        run: |
          cmake --version
          git --version

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDATACONV_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        
        run: |
          cd build
          ctest -C Release --output-on-failure --output-junit test-results.xml

      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/test-results.xml
          if-no-files-found: warn

      - name: Upload built application
        uses: actions/upload-artifact@v4
        with:
          name: dataconv-${{ matrix.os }}
          path: |
            build/dataconv
            build/Release/dataconv.exe
          if-no-files-found: warn
